name: ReadySite preview checks
on:
  pull_request:
    paths:
      - "index.html"
      - "intake-preview.html"
      - "READY_SITE_OFFER_MANIFEST.json"
      - "terms.html"
      - "refunds.html"
      - "privacy.html"
      - "tools/check_launch_readiness.py"
      - ".github/workflows/readysite-preview-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staged-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prelaunch safe-preview smoke checks
        run: python3 tools/check_launch_readiness.py
